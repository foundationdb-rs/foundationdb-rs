# select! loop whose other branch is always ready: the fresh 1 s timeout loses
# every iteration and the loop never yields to the simulator. Stops once RSS
# grew by rssLimitMiB.
[[test]]
testTitle = 'DelayLeak_select_ready'
clearAfterTest = false
runSetup = false

  [[test.workload]]
    useCAPI = true
    testName = 'External'
    workloadName = 'DelayLeakWorkload'
    libraryPath = './target/release/examples'
    libraryName = 'delay_leak'
    mode = 'select_ready'
    dropDelayMs = 1000.0
    iterations = 100000000
    reportEvery = 1000000
    rssLimitMiB = 3072
