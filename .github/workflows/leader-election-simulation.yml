name: Leader Election Simulation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [ labeled, unlabeled, opened, synchronize, reopened ]

jobs:
  simulation:
    name: "Leader Election Simulation (Nix) - ${{ matrix.instance }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'leader-election-correctness') && '{"instance":[1,2,3,4],"iterations":[200]}' || '{"instance":[1],"iterations":[10]}') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run leader election simulation (${{ matrix.iterations }} iterations)
        run: nix develop -c ./scripts/run_leader_election_simulation.sh ${{ matrix.iterations }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-traces-${{ matrix.instance }}
          path: ./target/traces/
          retention-days: 7
