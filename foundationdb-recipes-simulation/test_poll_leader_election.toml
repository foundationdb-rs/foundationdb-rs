# Poll-based, fenced leader-election simulation.
#
# Clients autonomously exercise one durable (revision, optional owner, lease
# duration) state. Every leader poll co-commits a RankedRegister read, protected
# write at its fencing rank, and a versionstamp-ordered operation-log entry.

[[test]]
testTitle = 'PollLeaderElection'

  [[test.workload]]
    testName = 'External'
    useCAPI = true
    libraryName = 'foundationdb_recipes_simulation'
    workloadName = 'LeaderElectionWorkload'
    libraryPath = './target/release'
    operationCount = 40
    suspicionSecs = 2

  [[test.workload]]
    # Deterministic network disruption exercises transaction retries and
    # maybe-committed outcomes. The commit log, not issue order, is the oracle.
    testName = 'RandomClogging'
    testDuration = 30.0
    swizzle = 1

  [[test.workload]]
    # Rebooted and error-recovered clients use fresh incarnations and local state.
    testName = 'Attrition'
    machinesToKill = 5
    machinesToLeave = 3
    reboot = true
    testDuration = 30.0
