# Leader Election Short Lease Stress
#
# Purpose: compress every interval the protocol reasons about until the margins
# are the only thing keeping it correct. With a three second lease, a renewal
# comes due every second and the belief horizon is under three: anything that
# takes a moment too long turns into a lost term rather than an overlap, and
# proving that is the point.
#
# Scenario:
# - Three second leases, half-second steps, so leases expire constantly
# - Crashes and resigns both frequent, so terms end in every way they can
# - Clock offset and rate error on, since a short lease leaves the least room
#   for them
# - Clogging and attrition over the first two thirds, then a quiet tail
#
# Bug classes this configuration catches:
# - Leases anchored at reply time instead of before the write was issued, which
#   only shows up when the commit takes a visible fraction of the lease
# - Renewals applied after the horizon they were racing
# - Observation windows measured against the wrong read
#
# On the fault window:
# The chaos workloads stop at roughly two thirds of the run and the workload
# keeps going to testDurationSecs, leaving a fault-free tail. ProgressMade asks
# whether the run recovered and made progress, and a run whose faults never
# stop has no window to recover *into*: whether it clears the floor then
# depends on how the kills happened to land rather than on the protocol. The
# tail is where the recovery property is demonstrated, which is what the floors
# were always meant to be asking about.

[[test]]
testTitle = 'LeaderElectionShortLeaseStress'

  [[test.workload]]
    testName = 'External'
    useCAPI = true
    libraryName = 'foundationdb_recipes_simulation'
    workloadName = 'LeaderElectionWorkload'
    libraryPath = './target/release'
    leaseDurationSecs = 3.0
    stepIntervalSecs = 0.5
    testDurationSecs = 90.0
    resignProbability = 0.2
    crashProbability = 0.1
    clockSkewMode = 'random'
    pauseFactor = 2.0
    sleeperEnabled = false
    minLeadershipClaims = 3
    minRenewals = 2
    minObservedIdentities = 4

  [[test.workload]]
    testName = 'RandomClogging'
    testDuration = 58.0
    swizzle = 1

  [[test.workload]]
    testName = 'Attrition'
    machinesToKill = 4
    machinesToLeave = 4
    reboot = true
    testDuration = 58.0
